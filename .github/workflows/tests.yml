name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      browser:
        description: Browser
        type: choice
        options: [chrome, firefox]
        default: chrome

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BROWSER: ${{ inputs.browser || 'chrome' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run tests
        run: |
          start=$(date +%s)
          set +e
          mvn -B test -Dheadless=true -Dbrowser="$BROWSER"
          status=$?
          echo "TEST_DURATION=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          exit $status

      - name: Write test report
        if: always()
        run: python3 .github/scripts/test_report.py target/surefire-reports >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            target/surefire-reports
            target/screenshots
          if-no-files-found: ignore
